<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .header {
            background: #4f46e5;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 500;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h2 {
            margin: 0 0 8px;
            font-size: 24px;
            font-weight: 500;
        }

        .welcome p {
            margin: 0;
            color: #777;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #4f46e5;
        }

        .card-title {
            font-size: 16px;
            color: #777;
            margin-bottom: 15px;
        }

        .card-number {
            font-size: 38px;
            font-weight: bold;
            color: #333;
        }

        @media (max-width: 600px) {
            .header {
                padding: 18px 20px;
            }

            .container {
                margin: 25px auto;
                padding: 0 15px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Admin Dashboard</h1>
    </div>

    <div class="container">

        <div class="welcome">
            <h2>Dashboard Overview</h2>
            <p>Overview of students and quiz questions.</p>
        </div>

        <div class="cards">

            <div class="card">
                <div class="card-title">Total Students</div>
                <div class="card-number">{{ total_students }}</div>
            </div>

            <div class="card">
                <div class="card-title">Total Questions</div>
                <div class="card-number">{{ total_questions }}</div>
            </div>

        </div>

    </div>

</body>
</html>
