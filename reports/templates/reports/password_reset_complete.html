<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizopedia | Password Reset Complete</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            flex-direction: column;
        }

        /* Top Navbar */
        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 16px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #111827;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 700;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-link {
            text-decoration: none;
            color: #64748b;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: color 0.15s, background 0.15s;
        }

        .nav-link:hover {
            color: #4f46e5;
            background: #f1f5f9;
        }

        /* Page Content */
        .page-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .card-wrapper {
            width: 100%;
            max-width: 440px;
        }

        /* Flat Card Border (Zero Drop-Shadow) */
        .card {
            background: #ffffff;
            padding: 40px 34px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: none;
            text-align: center;
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        .btn-link {
            display: inline-block;
            width: 100%;
            height: 46px;
            line-height: 46px;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 14.5px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.15s;
        }

        .btn-link:hover {
            background: #4338ca;
        }

        /* Footer */
        .footer {
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 20px 36px;
            font-size: 13.5px;
            color: #64748b;
            margin-top: auto;
        }

        .footer-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .footer-left-content {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .footer-admin-link {
            text-decoration: none;
            color: #64748b;
            font-size: 13.5px;
            font-weight: 500;
            transition: color 0.15s;
        }

        .footer-admin-link:hover {
            color: #4f46e5;
            text-decoration: underline;
        }

        .footer-dot {
            color: #cbd5e1;
        }

        .footer-copy {
            color: #64748b;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 14px 20px;
            }
            .footer {
                padding: 16px 20px;
            }
            .card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="{% url 'home' %}" class="brand">
            <div class="brand-icon">Q</div>
            <span class="brand-name">Quizopedia</span>
        </a>

        <nav class="nav-links">
            <a href="{% url 'home' %}" class="nav-link">Home</a>
            <a href="{% url 'home' %}#subjects" class="nav-link">Subjects</a>
            <a href="{% url 'login' %}" class="nav-link">Sign In</a>
        </nav>
    </header>

    <main class="page-content">
        <div class="card-wrapper">
            <div class="card">
                <div class="icon-circle">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <h1>Password Changed!</h1>
                <p>
                    Your password has been successfully reset.
                    You can now use your new password to sign in.
                </p>

                <a href="{% url 'login' %}" class="btn-link">Sign In Now</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-left-content">
                <a href="{% url 'admin_login' %}" class="footer-admin-link">Admin Login</a>
                <span class="footer-dot">&middot;</span>
                <span class="footer-copy">&copy; 2026 Quizopedia &middot; Academic Quiz &amp; Student Report System</span>
            </div>
        </div>
    </footer>

</body>
</html>
