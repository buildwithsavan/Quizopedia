<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.10);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: #4f46e5;
            color: white;

            font-size: 28px;
            font-weight: 700;
        }

        .profile-header h1 {
            font-size: 26px;
            margin-bottom: 5px;
        }

        .profile-header p {
            color: #64748b;
            font-size: 14px;
        }

        .info {
            margin-bottom: 16px;
        }

        .label {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 5px;
        }

        .value {
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
        }

        .back-button {
            display: block;
            margin-top: 25px;
            padding: 12px;
            text-align: center;

            text-decoration: none;
            border-radius: 9px;

            background: #4f46e5;
            color: white;
            font-weight: 600;
        }

        .back-button:hover {
            background: #4338ca;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <div class="profile-header">

            <div class="avatar">
                {{ profile.name|first|upper }}
            </div>

            <h1>{{ profile.name }}</h1>

            <p>{{ profile_type }} Profile</p>

        </div>

        <div class="info">
            <div class="label">Name</div>
            <div class="value">
                {{ profile.name }}
            </div>
        </div>

        <div class="info">
            <div class="label">Email</div>
            <div class="value">
                {{ profile.email }}
            </div>
        </div>

        <div class="info">
            <div class="label">Phone</div>
            <div class="value">
                {{ profile.phone }}
            </div>
        </div>

        <a href="{% url 'dashboard' %}" class="back-button">
            Back to Dashboard
        </a>

    </div>

</body>
</html>
