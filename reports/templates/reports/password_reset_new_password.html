<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizopedia | Set New Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #dbeafe 0%, transparent 35%),
                radial-gradient(circle at bottom right, #e0e7ff 0%, transparent 35%),
                #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1e293b;
        }

        .card-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            padding: 40px 36px;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            font-size: 26px;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
        }

        .brand h1 {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 6px;
        }

        .brand p {
            font-size: 14px;
            color: #64748b;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
        }

        .field input {
            width: 100%;
            height: 48px;
            padding: 0 44px 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            color: #1e293b;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.10);
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            height: 50px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.20);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 22px rgba(79, 70, 229, 0.25);
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card-wrapper">
        <div class="card">
            <div class="brand">
                <div class="logo">Q</div>
                <h1>Choose New Password</h1>
                <p>Your OTP was verified. Create your new password below.</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="field">
                    <label for="id_password">New Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" id="id_password" placeholder="Enter new password" required autocomplete="new-password">
                        <button type="button" class="toggle-btn" onclick="togglePass('id_password', this)">Show</button>
                    </div>
                </div>

                <div class="field">
                    <label for="id_confirm_password">Confirm New Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="confirm_password" id="id_confirm_password" placeholder="Confirm new password" required autocomplete="new-password">
                        <button type="button" class="toggle-btn" onclick="togglePass('id_confirm_password', this)">Show</button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Save New Password</button>
            </form>

            <div class="footer">
                &copy; 2026 Quizopedia &middot; Report Card Generation
            </div>
        </div>
    </div>

    <script>
        function togglePass(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "Hide";
            } else {
                input.type = "password";
                btn.textContent = "Show";
            }
        }
    </script>
</body>
</html>
