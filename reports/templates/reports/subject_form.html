<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | Quizopedia</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
        }

        .admin-main {
            flex: 1;
            min-width: 0;
            padding: 32px 36px 60px;
            overflow-x: hidden;
        }

        .main-container {
            max-width: 620px;
            margin: 0 auto;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }

        .breadcrumb a {
            color: #64748b;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        .panel {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 32px 34px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .subtext {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13.5px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: #1e293b;
            background: #ffffff;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 26px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 22px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: background 0.15s;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .primary:hover {
            background: #1d4ed8;
        }

        .back {
            background: #e5eaf0;
            color: #263248;
        }

        .back:hover {
            background: #cbd5e1;
        }

        .message {
            background: #fee8e8;
            color: #b42318;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13.5px;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .admin-main {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>

    {% include 'reports/includes/admin_sidebar.html' with active_page='subjects' %}

    <main class="admin-main">
        <div class="main-container">

            <div class="breadcrumb">
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <span>/</span>
                <a href="{% url 'subject_list' %}">Subjects</a>
                <span>/</span>
                <span>{{ page_title }}</span>
            </div>

            <div class="panel">
                <h1>{{ page_title }}</h1>
                <p class="subtext">Enter the subject details below.</p>

                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}

                <form method="post">
                    {% csrf_token %}

                    <div class="form-group">
                        <label for="name">Subject Name <span style="color: #dc2626;">*</span></label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            maxlength="100"
                            value="{{ subject.name|default:'' }}"
                            placeholder="e.g., History"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            name="description"
                            placeholder="History is the roadmap of human experience that explains how past events shaped our modern laws, cultures, and societies."
                        >{{ subject.description|default:'' }}</textarea>
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn primary">Save Subject</button>
                        <a href="{% url 'subject_list' %}" class="btn back">Cancel</a>
                    </div>
                </form>
            </div>

        </div>
    </main>

</body>
</html>
