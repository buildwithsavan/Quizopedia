<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizopedia | Check Your Email</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #dbeafe 0%, transparent 35%),
                radial-gradient(circle at bottom right, #e0e7ff 0%, transparent 35%),
                #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1e293b;
        }

        .card-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            padding: 40px 36px;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #e0e7ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 12px;
        }

        p {
            font-size: 14.5px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        .btn-link {
            display: inline-block;
            width: 100%;
            height: 48px;
            line-height: 48px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.20);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-link:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 22px rgba(79, 70, 229, 0.25);
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="card-wrapper">
        <div class="card">
            <div class="icon-circle">✉️</div>
            <h1>Check Your Email</h1>
            <p>
                We've sent password reset instructions to your email address.
                Please check your inbox (and spam folder) and follow the link provided.
            </p>

            <a href="{% url 'login' %}" class="btn-link">Return to Sign In</a>

            <div class="footer">
                &copy; 2026 Quizopedia &middot; Report Card Generation
            </div>
        </div>
    </div>
</body>
</html>
