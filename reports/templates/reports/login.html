<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>

    <h1>Login</h1>
    {% if form.errors %}
        <p>Username or password is incorrect.</p>
    {% endif %}

    <form action={% url 'admin_list' %} method="post">
        {% csrf_token %}
        <p>
            <label>Username:</label>
            {{ form.username}}
        </p>
        <p>
            <label>Password:</label>
            {{ form.password}}
        </p>

        <button type="submit">Login</button>
    </form>  
</body>
</html>
