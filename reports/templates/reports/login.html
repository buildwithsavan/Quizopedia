<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quizopedia | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, #dbeafe 0%, transparent 35%),
                radial-gradient(circle at bottom right, #e0e7ff 0%, transparent 35%),
                #f8fafc;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1e293b;
        }

        /* Main container */
        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        /* Login card */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 42px 38px;
            border-radius: 20px;

            box-shadow:
                0 20px 45px rgba(15, 23, 42, 0.10),
                0 5px 15px rgba(15, 23, 42, 0.05);

            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Brand */
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 62px;
            height: 62px;
            margin: 0 auto 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #6366f1
            );

            color: white;
            font-size: 28px;
            font-weight: 700;

            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
        }

        .brand h1 {
            font-size: 30px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 7px;
        }

        .brand p {
            font-size: 14px;
            color: #64748b;
        }

        /* Error message */
        .error {
            padding: 12px 14px;
            margin-bottom: 20px;

            border-radius: 10px;

            background: #fef2f2;
            border: 1px solid #fecaca;

            color: #b91c1c;
            font-size: 14px;
        }

        /* Form field */
        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        .input-wrapper {
            position: relative;
        }

        .field input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            border: 1px solid #cbd5e1;
            border-radius: 10px;

            background: #ffffff;

            color: #1e293b;
            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .field input::placeholder {
            color: #94a3b8;
        }

        .field input:hover {
            border-color: #94a3b8;
        }

        .field input:focus {
            border-color: #4f46e5;

            box-shadow:
                0 0 0 4px rgba(79, 70, 229, 0.10);
        }

        /* Password input */
        #id_password {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #64748b;
            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
        }

        .toggle-password:hover {
            color: #4f46e5;
        }

        /* Login button */
        .login-button {
            width: 100%;
            height: 50px;

            margin-top: 5px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #6366f1
            );

            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.20);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 12px 22px rgba(79, 70, 229, 0.25);
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 24px;

            font-size: 12px;
            color: #94a3b8;
        }

        /* Mobile */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
                border-radius: 16px;
            }

            .brand h1 {
                font-size: 26px;
            }

            .logo {
                width: 56px;
                height: 56px;
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <div class="login-card">

            <!-- Brand -->
            <div class="brand">

                <div class="logo">
                    Q
                </div>

                <h1>Quizopedia</h1>

                <p>
                    Sign in to access your account
                </p>

            </div>


            <!-- Error -->
            {% if form.errors %}

                <div class="error">
                    Username or password is incorrect.
                    Please try again.
                </div>

            {% endif %}


            <!-- Login form -->
            <form action="{% url 'login' %}" method="post">

                {% csrf_token %}


                <!-- Username -->
                <div class="field">

                    <label for="id_username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        {{ form.username }}

                    </div>

                </div>


                <!-- Password -->
                <div class="field">

                    <label for="id_password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        {{ form.password }}

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword()"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Next URL -->
                {% if next %}

                    <input
                        type="hidden"
                        name="next"
                        value="{{ next }}"
                    >

                {% endif %}


                <!-- Login button -->
                <button
                    class="login-button"
                    type="submit"
                >
                    Sign In
                </button>

            </form>


            <div class="login-footer">
                &copy; 2026 Quizopedia &middot; Report Card Generation
            </div>

        </div>

    </div>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("id_password");

            const button =
                document.querySelector(".toggle-password");


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "Hide";

            } else {

                password.type = "password";

                button.textContent = "Show";

            }

        }

    </script>

</body>
</html>
