<!DOCTYPE html>
<html>
<head>
    <title>Admin List</title>
</head>
<body>

    <h1>Admin Details</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
        </tr>

        {% for admin in admins %}
        <tr>
            <td>{{ admin.id }}</td>
            <td>{{ admin.name }}</td>
            <td>{{ admin.email }}</td>
            <td>{{ admin.phone }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No admin records found.</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
